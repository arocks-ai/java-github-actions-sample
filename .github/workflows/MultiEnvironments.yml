name: Multi-Environment Deployment

on:
  workflow_dispatch:
    inputs:
      environments:
        description: 'Comma-separated list of environments (e.g., dev,npe,prod)'
        required: true
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Convert input to JSON array
        id: set-matrix
        run: |
          target_envs="${{ github.event.inputs.environments }}"
          target_envs="${target_envs// /}"  # Remove spaces
          ENV_LIST=$(echo "$target_envs" | awk -F',' '{for(i=1;i<=NF;i++) printf "\"%s\"%s", $i, (i<NF?",":"") }')
          #echo "::set-output name=matrix::{\"env\":[$ENV_LIST]}"
          echo "env_json={\"env\":[$ENV_LIST]}" >> $GITHUB_OUTPUT
          echo "target_envs=$target_envs" >> $GITHUB_OUTPUT
        shell: bash

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1              # run one job only at any time 
      matrix: ${{ fromJson(needs.build.outputs.env_json) }}
    name: Deploy to ${{ matrix.env }}
    steps:
      - name: Checkout repository                   # path is needed otherwise extra repo directory will be created inside runner
        uses: actions/checkout@v3
        with:
          path: .

      - name: Set firstrun based on environment position
        id: set_firstrun
        run: |
          #target_envs="${{ github.event.inputs.environments }}"
          target_envs="${{ needs.build.outputs.target_envs }}"
          ENVIRONMENT="${{ matrix.env }}"
          echo "aak - ENVIRONMENT = $ENVIRONMENT"
          echo "aak - target_envs = $target_envs"
          echo "== list files under .github/scripts/"
          ls -al .github/scripts/

          echo "== list files under .github/scripts/set-target-env-variables.sh"
          ls -al .github/scripts/set-target-env-variables.sh

          chmod 755 .github/scripts/set-target-env-variables.sh

          echo == 'running .github/scripts/set-target-env-variables.sh "$ENVIRONMENT" "$target_envs"'
          .github/scripts/set-target-env-variables.sh "$ENVIRONMENT" "$target_envs"
        shell: bash            # this line should not be inside run
      
      - name: Print firstrun value
        run: echo "firstrun is ${{ steps.set_firstrun.outputs.firstrun }}"
