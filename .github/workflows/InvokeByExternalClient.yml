name: Invoked by external Client
run-name: Invoked by external Client

on: 
 workflow_dispatch:
 #repository_dispatch:           # External Client Trigger
   # type: [ run_my_workflow ]    # Input Type should be run_my_workflow
   inputs:
     name:
       description: "Your name"
       required: true
       default: "Guest"
     env:
       description: "Environment (e.g., prod, staging)"
       required: false
       default: "dev"   
  
jobs:
  Example-Actions-Job:
    name: Exploring GitHub Actions - External Client invoke
    runs-on: ubuntu-latest

      
    steps:
      # Input to the workflow
      - run: echo "Payload has name = ${{ inputs.name }}"
      - run: echo "Payload has name = ${{ inputs.env}}"

    
